<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Deep midnight navy radial/diagonal backdrop -->
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#112942" />
      <stop offset="55%" stop-color="#0b1a2b" />
      <stop offset="100%" stop-color="#060e18" />
    </radialGradient>

    <!-- Left leg & apex cyan-aqua metallic gradient -->
    <linearGradient id="leftLegGrad" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#1479c9" />
      <stop offset="50%" stop-color="#1cc5e8" />
      <stop offset="100%" stop-color="#7ef9ff" />
    </linearGradient>

    <!-- Inner/right leg deeper ocean-blue to cyan gradient -->
    <linearGradient id="rightLegGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e5fa8" />
      <stop offset="55%" stop-color="#179cd8" />
      <stop offset="100%" stop-color="#3ce8ff" />
    </linearGradient>

    <!-- Sweeping S-curve & rising chart arrow gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1358be" />
      <stop offset="35%" stop-color="#189ee0" />
      <stop offset="72%" stop-color="#2ce2f7" />
      <stop offset="100%" stop-color="#84ffff" />
    </linearGradient>

    <!-- Subtle top highlight for the arrow ribbon -->
    <linearGradient id="arrowHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2b86e8" />
      <stop offset="50%" stop-color="#5ceeff" />
      <stop offset="100%" stop-color="#b8ffff" />
    </linearGradient>

    <!-- Soft cyan drop shadow for depth -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.9" flood-color="#00d8ff" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Square background matching favicon2.png -->
  <rect width="32" height="32" fill="url(#bgGlow)" />

  <!-- Subtle network constellation lines & nodes -->
  <g stroke="#297fb8" stroke-width="0.25" opacity="0.32">
    <line x1="21.5" y1="5.2" x2="26.2" y2="1.2" />
    <line x1="26.2" y1="1.2" x2="30.5" y2="8.0" />
    <line x1="21.5" y1="5.2" x2="30.5" y2="8.0" />
    <line x1="2.0" y1="25.0" x2="5.2" y2="29.6" />
    <line x1="5.2" y1="29.6" x2="10.2" y2="27.2" />
  </g>
  <g fill="#4be3ff" opacity="0.45">
    <circle cx="21.5" cy="5.2" r="0.55" />
    <circle cx="26.2" cy="1.2" r="0.6" />
    <circle cx="30.5" cy="8.0" r="0.55" />
    <circle cx="5.2" cy="29.6" r="0.55" />
  </g>

  <!-- Main Emblem Group -->
  <g filter="url(#softGlow)">
    <!-- Inner / Right Leg of the 'A' (behind the arrow) -->
    <path d="M15.1 10.3 L16.6 10.3 L21.0 20.6 L18.9 20.6 L15.7 13.3 L13.8 17.3 L11.7 17.3 Z" fill="url(#rightLegGrad)" />

    <!-- Left Leg of the 'A' with curved top serif -->
    <path d="M11.3 17.4 L14.4 11.2 C14.8 10.5 15.3 10.2 16.2 10.2 L16.7 10.2 C16.0 10.6 15.7 11.1 15.3 11.9 L13.2 16.4 Z" fill="url(#leftLegGrad)" />

    <!-- Sweeping Trend Arrow Ribbon (lower tail -> zigzag -> arrowhead) -->
    <path d="M9.4 20.6
             C10.4 18.1, 11.9 17.1, 13.7 16.8
             C14.8 16.6, 15.6 16.0, 16.3 15.1
             L18.2 12.7
             L19.8 14.5
             L22.3 11.8
             L20.9 10.7
             L24.4 9.8
             L23.7 13.3
             L22.5 12.3
             L19.8 16.2
             L18.1 14.4
             L16.4 16.6
             C15.5 17.7, 14.5 18.2, 13.2 18.5
             C12.1 18.8, 11.4 19.5, 11.0 20.6 Z" fill="url(#arrowGrad)" />

    <!-- Crisp upper bevel edge along the rising arrow -->
    <path d="M9.7 20.5
             C10.6 18.3, 12.0 17.3, 13.7 17.0
             C14.8 16.8, 15.6 16.2, 16.3 15.3
             L18.2 12.9
             L19.8 14.7
             L22.4 11.9
             L21.1 10.8
             L24.3 10.0
             L23.6 13.1
             L22.5 12.1
             L19.8 15.5
             L18.2 13.7
             L16.3 16.0
             C15.5 17.0, 14.6 17.5, 13.4 17.8
             C12.0 18.1, 11.0 18.9, 10.3 20.5 Z" fill="url(#arrowHighlight)" opacity="0.85" />
  </g>
</svg>